<svg width="390" height="844" viewBox="0 0 390 844" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- FIGMA METADATA: Frame Name = GymPulse / 04 - Member Mobile Portal (Exact Project Match) -->
  <defs>
    <filter id="mobCardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.15"/>
    </filter>
  </defs>

  <style>
    .font-display { font-family: 'Space Grotesk', -apple-system, sans-serif; font-weight: 700; }
    .font-sans { font-family: 'Inter', -apple-system, sans-serif; }
    .text-slate-900 { fill: #0F172A; }
    .text-slate-700 { fill: #334155; }
    .text-slate-500 { fill: #64748B; }
    .text-slate-400 { fill: #94A3B8; }
    .text-white { fill: #FFFFFF; }
    .text-lime { fill: #65A30D; }
    .text-lime-bright { fill: #84CC16; }
    .text-emerald { fill: #059669; }
  </style>

  <!-- Mobile Canvas Background (Slate-50) -->
  <rect width="390" height="844" rx="40" fill="#F8FAFC"/>
  <rect x="0.5" y="0.5" width="389" height="843" rx="39.5" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ==================== 1. MOBILE STATUS BAR (Y: 0 - 45) ==================== -->
  <g id="Status_Bar" transform="translate(0, 0)">
    <text x="32" y="30" class="font-sans text-slate-900" font-size="14" font-weight="600">09:41</text>
    <rect x="135" y="10" width="120" height="26" rx="13" fill="#0F172A"/>

    <g transform="translate(325, 18)">
      <rect x="22" y="2" width="20" height="10" rx="3" stroke="#0F172A" stroke-width="1.2"/>
      <rect x="24" y="4" width="13" height="6" rx="1.5" fill="#65A30D"/>
    </g>
  </g>

  <!-- Header Profile Bar -->
  <g transform="translate(20, 52)">
    <circle cx="22" cy="22" r="22" fill="#ECFCCB"/>
    <text x="22" y="28" class="font-display text-lime" font-size="16" text-anchor="middle">AC</text>

    <g transform="translate(54, 8)">
      <text x="0" y="12" class="font-sans text-slate-500" font-size="12">Selamat Datang,</text>
      <text x="0" y="30" class="font-display text-slate-900" font-size="18">Alexander Chen</text>
    </g>

    <!-- Bell Icon -->
    <g transform="translate(305, 6)">
      <circle cx="20" cy="20" r="18" fill="#FFFFFF" stroke="#E2E8F0"/>
      <path d="M16 22H24M20 12C18 12 16 14 16 16V19L14 21H26L24 19V16C24 14 22 12 20 12Z" stroke="#64748B" stroke-width="1.5"/>
      <circle cx="26" cy="14" r="4" fill="#84CC16"/>
    </g>
  </g>

  <!-- ==================== 2. DIGITAL RFID MEMBER CARD (Y: 120 - 325) ==================== -->
  <g id="Digital_Member_Card" transform="translate(20, 120)" filter="url(#mobCardShadow)">
    <rect width="350" height="200" rx="20" fill="#0F172A"/>

    <!-- Brand Header on Card -->
    <g transform="translate(20, 20)">
      <rect width="28" height="28" rx="7" fill="#84CC16"/>
      <text x="14" y="20" class="font-display text-slate-900" font-size="15" text-anchor="middle">G</text>
      <text x="38" y="19" class="font-display text-white" font-size="16">GymPulse<tspan fill="#84CC16">.</tspan></text>
      
      <!-- Package Pill -->
      <rect x="225" y="0" width="85" height="22" rx="6" fill="#1E293B"/>
      <text x="267" y="15" class="font-sans text-lime-bright" font-size="10" font-weight="700" text-anchor="middle">PRO UNLIMITED</text>
    </g>

    <!-- RFID Chip & QR Code -->
    <g transform="translate(20, 75)">
      <!-- Contactless Chip Icon -->
      <rect width="40" height="30" rx="6" fill="#1E293B" stroke="#84CC16"/>
      <path d="M12 15H28M20 7V23" stroke="#84CC16" stroke-width="1.2"/>

      <!-- NFC Waves -->
      <path d="M50 18C52 16 52 14 50 12M56 22C60 18 60 12 56 8" stroke="#84CC16" stroke-width="2" stroke-linecap="round"/>

      <!-- QR Code Box -->
      <g transform="translate(250, -5)">
        <rect width="60" height="60" rx="8" fill="#FFFFFF"/>
        <rect x="6" y="6" width="18" height="18" fill="#0F172A"/>
        <rect x="10" y="10" width="10" height="10" fill="#FFFFFF"/>
        <rect x="36" y="6" width="18" height="18" fill="#0F172A"/>
        <rect x="40" y="10" width="10" height="10" fill="#FFFFFF"/>
        <rect x="6" y="36" width="18" height="18" fill="#0F172A"/>
        <rect x="10" y="40" width="10" height="10" fill="#FFFFFF"/>
      </g>
    </g>

    <!-- Member Card Details -->
    <g transform="translate(20, 150)">
      <text x="0" y="12" class="font-sans text-slate-400" font-size="10">NAMA LENGKAP</text>
      <text x="0" y="28" class="font-sans text-white" font-size="13" font-weight="700">Alexander Chen</text>

      <text x="135" y="12" class="font-sans text-slate-400" font-size="10">RFID UID</text>
      <text x="135" y="28" class="font-sans text-lime-bright" font-size="12" font-family="'JetBrains Mono'">4A:9C:12:F1</text>

      <text x="245" y="12" class="font-sans text-slate-400" font-size="10">BERLAKU S/D</text>
      <text x="245" y="28" class="font-sans text-white" font-size="12" font-weight="600">12 Des 2026</text>
    </g>
  </g>

  <!-- ==================== 3. CROWD STATUS & QUICK ACTIONS (Y: 335 - 430) ==================== -->
  <g transform="translate(20, 335)">
    <!-- Crowd Status Bar (Exact Match: "Sepi & Segar") -->
    <rect width="350" height="42" rx="10" fill="#D1FAE5" stroke="#A7F3D0"/>
    <circle cx="16" cy="21" r="4" fill="#059669"/>
    <text x="28" y="25" class="font-sans text-emerald" font-size="12" font-weight="700">Sepi &amp; Segar</text>
    <text x="120" y="25" class="font-sans text-emerald" font-size="11">Waktu terbaik latihan bebas antre.</text>

    <!-- Quick Action Buttons Row -->
    <g transform="translate(0, 52)">
      <!-- Renew Online -->
      <g transform="translate(0, 0)">
        <rect width="80" height="65" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
        <circle cx="40" cy="24" r="14" fill="#ECFCCB"/>
        <path d="M35 24L40 19L45 24M40 20V29" stroke="#65A30D" stroke-width="1.8" stroke-linecap="round"/>
        <text x="40" y="52" class="font-sans text-slate-800" font-size="11" font-weight="600" text-anchor="middle">Perpanjang</text>
      </g>

      <!-- Scan QR -->
      <g transform="translate(90, 0)">
        <rect width="80" height="65" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
        <circle cx="40" cy="24" r="14" fill="#E0F2FE"/>
        <rect x="33" y="17" width="14" height="14" rx="2" stroke="#0284C7" stroke-width="1.5"/>
        <text x="40" y="52" class="font-sans text-slate-800" font-size="11" font-weight="600" text-anchor="middle">Scan QR</text>
      </g>

      <!-- Gym Store -->
      <g transform="translate(180, 0)">
        <rect width="80" height="65" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
        <circle cx="40" cy="24" r="14" fill="#FEF3C7"/>
        <path d="M34 22H46L44 28H36L34 22Z" stroke="#D97706" stroke-width="1.5"/>
        <text x="40" y="52" class="font-sans text-slate-800" font-size="11" font-weight="600" text-anchor="middle">Store POS</text>
      </g>

      <!-- Invoice -->
      <g transform="translate(270, 0)">
        <rect width="80" height="65" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
        <circle cx="40" cy="24" r="14" fill="#F1F5F9"/>
        <path d="M35 24H45M35 20H45M35 28H41" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
        <text x="40" y="52" class="font-sans text-slate-800" font-size="11" font-weight="600" text-anchor="middle">Kuitansi</text>
      </g>
    </g>
  </g>

  <!-- ==================== 4. DAILY WORKOUT SPLIT (Y: 465 - 580) ==================== -->
  <g transform="translate(20, 465)">
    <rect width="350" height="110" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <g transform="translate(16, 16)">
      <rect width="90" height="20" rx="5" fill="#ECFCCB"/>
      <text x="45" y="14" class="font-sans text-lime" font-size="10" font-weight="700" text-anchor="middle">PROGRAM HARI INI</text>

      <text x="0" y="42" class="font-display text-slate-900" font-size="15">Senin: Chest &amp; Triceps</text>
      <text x="0" y="60" class="font-sans text-slate-500" font-size="12">Fokus: Bench Press, Incline DB Press, Dips</text>
      <text x="0" y="78" class="font-sans text-slate-600" font-size="11">💡 Minum 2.5L air &amp; 25-30g protein setelah sesi.</text>
    </g>
  </g>

  <!-- ==================== 5. ATTENDANCE TARGET PROGRESS (Y: 590 - 690) ==================== -->
  <g transform="translate(20, 590)">
    <rect width="350" height="95" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <g transform="translate(16, 16)">
      <text x="0" y="12" class="font-sans text-slate-500" font-size="11" font-weight="600">TARGET LATIHAN BULANAN</text>
      <text x="0" y="34" class="font-display text-slate-900" font-size="18">14 Sesi <tspan font-size="12" fill="#64748B">/ 12 Target Kunjungan</tspan></text>
      <text x="318" y="34" class="font-sans text-lime" font-size="12" font-weight="700" text-anchor="end">100% Tercapai!</text>

      <rect x="0" y="46" width="318" height="8" rx="4" fill="#F1F5F9"/>
      <rect x="0" y="46" width="318" height="8" rx="4" fill="#84CC16"/>
    </g>
  </g>

  <!-- ==================== 6. MOBILE BOTTOM NAVIGATION (Y: 760 - 844) ==================== -->
  <g id="Mobile_Nav" transform="translate(0, 760)">
    <rect width="390" height="84" fill="#FFFFFF"/>
    <line x1="0" y1="0" x2="390" y2="0" stroke="#E2E8F0" stroke-width="1"/>

    <!-- Home (Active) -->
    <g transform="translate(38, 14)">
      <circle cx="12" cy="10" r="10" fill="#ECFCCB"/>
      <path d="M7 12L12 8L17 12V16H7V12Z" fill="#65A30D"/>
      <text x="12" y="28" class="font-sans text-lime" font-size="10" font-weight="700" text-anchor="middle">Beranda</text>
    </g>

    <!-- RFID Card -->
    <g transform="translate(112, 14)">
      <rect x="4" y="2" width="16" height="12" rx="3" stroke="#64748B" stroke-width="1.5"/>
      <path d="M8 8H12" stroke="#64748B" stroke-width="1.5"/>
      <text x="12" y="28" class="font-sans text-slate-500" font-size="10" text-anchor="middle">Kartu</text>
    </g>

    <!-- Gym Store -->
    <g transform="translate(186, 14)">
      <path d="M6 6H18L16 13H8L6 6Z" stroke="#64748B" stroke-width="1.5"/>
      <text x="12" y="28" class="font-sans text-slate-500" font-size="10" text-anchor="middle">Store</text>
    </g>

    <!-- Absensi -->
    <g transform="translate(260, 14)">
      <path d="M6 6H18M6 10H18M6 14H12" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
      <text x="12" y="28" class="font-sans text-slate-500" font-size="10" text-anchor="middle">Absensi</text>
    </g>

    <!-- Profile -->
    <g transform="translate(332, 14)">
      <circle cx="12" cy="6" r="4" stroke="#64748B" stroke-width="1.5"/>
      <path d="M6 16C6 13 9 12 12 12C15 12 18 13 18 16" stroke="#64748B" stroke-width="1.5"/>
      <text x="12" y="28" class="font-sans text-slate-500" font-size="10" text-anchor="middle">Profil</text>
    </g>
  </g>
</svg>
