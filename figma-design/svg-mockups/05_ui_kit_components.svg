<svg width="1440" height="1200" viewBox="0 0 1440 1200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- FIGMA METADATA: Frame Name = GymPulse / 05 - UI Kit & Design System (Exact Project Match) -->
  <defs>
    <filter id="uikitShadow" x="-3%" y="-3%" width="106%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>
  </defs>

  <style>
    .font-display { font-family: 'Space Grotesk', -apple-system, sans-serif; font-weight: 700; }
    .font-sans { font-family: 'Inter', -apple-system, sans-serif; }
    .text-slate-900 { fill: #0F172A; }
    .text-slate-800 { fill: #1E293B; }
    .text-slate-600 { fill: #475569; }
    .text-slate-500 { fill: #64748B; }
    .text-slate-400 { fill: #94A3B8; }
    .text-white { fill: #FFFFFF; }
    .text-lime { fill: #65A30D; }
    .text-lime-bright { fill: #84CC16; }
    .text-emerald { fill: #059669; }
    .text-rose { fill: #DC2626; }
  </style>

  <!-- Base Canvas Background (Slate-50) -->
  <rect width="1440" height="1200" fill="#F8FAFC"/>

  <!-- Top Title Banner -->
  <g transform="translate(80, 45)">
    <div class="flex items-center gap-2">
      <rect width="32" height="32" rx="8" fill="#0F172A"/>
      <text x="16" y="22" class="font-display text-lime-bright" font-size="18" text-anchor="middle">G</text>
      <text x="42" y="22" class="font-display text-slate-900" font-size="22">GymPulse Design System &amp; UI Kit</text>
    </div>
    <text x="0" y="55" class="font-sans text-slate-500" font-size="14">
      Komponen resmi berbasis Clean Athletic Slate &amp; Volt Lime dari project GymPulse Laravel 11.
    </text>
  </g>
  <line x1="80" y1="125" x2="1360" y2="125" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ==================== 1. COLOR PALETTE SWATCHES (Y: 145 - 280) ==================== -->
  <g transform="translate(80, 145)">
    <text x="0" y="0" class="font-display text-slate-900" font-size="16">1. COLOR SYSTEM &amp; SWATCHES</text>

    <g transform="translate(0, 20)">
      <!-- Volt Lime 500 -->
      <g transform="translate(0, 0)">
        <rect width="110" height="55" rx="10" fill="#84CC16"/>
        <text x="0" y="75" class="font-sans text-slate-900" font-size="12" font-weight="700">Volt Lime</text>
        <text x="0" y="90" class="font-sans text-slate-500" font-size="11">#84CC16</text>
      </g>
      <!-- Lime Soft 100 -->
      <g transform="translate(130, 0)">
        <rect width="110" height="55" rx="10" fill="#ECFCCB" stroke="#D9F99D"/>
        <text x="0" y="75" class="font-sans text-slate-900" font-size="12" font-weight="700">Lime Soft (Badge)</text>
        <text x="0" y="90" class="font-sans text-slate-500" font-size="11">#ECFCCB</text>
      </g>
      <!-- Slate 900 Primary -->
      <g transform="translate(260, 0)">
        <rect width="110" height="55" rx="10" fill="#0F172A"/>
        <text x="0" y="75" class="font-sans text-slate-900" font-size="12" font-weight="700">Slate 900 (Dark)</text>
        <text x="0" y="90" class="font-sans text-slate-500" font-size="11">#0F172A</text>
      </g>
      <!-- Slate 50 Body -->
      <g transform="translate(390, 0)">
        <rect width="110" height="55" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
        <text x="0" y="75" class="font-sans text-slate-900" font-size="12" font-weight="700">Slate 50 (Base)</text>
        <text x="0" y="90" class="font-sans text-slate-500" font-size="11">#F8FAFC</text>
      </g>
      <!-- Emerald 500 -->
      <g transform="translate(520, 0)">
        <rect width="110" height="55" rx="10" fill="#10B981"/>
        <text x="0" y="75" class="font-sans text-slate-900" font-size="12" font-weight="700">Emerald Active</text>
        <text x="0" y="90" class="font-sans text-slate-500" font-size="11">#10B981</text>
      </g>
      <!-- Coral 500 -->
      <g transform="translate(650, 0)">
        <rect width="110" height="55" rx="10" fill="#EF4444"/>
        <text x="0" y="75" class="font-sans text-slate-900" font-size="12" font-weight="700">Coral (Danger)</text>
        <text x="0" y="90" class="font-sans text-slate-500" font-size="11">#EF4444</text>
      </g>
      <!-- Sky 500 -->
      <g transform="translate(780, 0)">
        <rect width="110" height="55" rx="10" fill="#0EA5E9"/>
        <text x="0" y="75" class="font-sans text-slate-900" font-size="12" font-weight="700">Sky (Drinks)</text>
        <text x="0" y="90" class="font-sans text-slate-500" font-size="11">#0EA5E9</text>
      </g>
      <!-- Border 200 -->
      <g transform="translate(910, 0)">
        <rect width="110" height="55" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
        <text x="0" y="75" class="font-sans text-slate-900" font-size="12" font-weight="700">Border Default</text>
        <text x="0" y="90" class="font-sans text-slate-500" font-size="11">#E2E8F0</text>
      </g>
    </g>
  </g>
  <line x1="80" y1="275" x2="1360" y2="275" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ==================== 2. BUTTONS & ACTIONS (Y: 295 - 460) ==================== -->
  <g transform="translate(80, 295)">
    <text x="0" y="0" class="font-display text-slate-900" font-size="16">2. BUTTONS &amp; CTAS</text>

    <g transform="translate(0, 20)">
      <!-- Button 1: Primary Dark Action -->
      <g transform="translate(0, 0)">
        <rect width="180" height="46" rx="12" fill="#0F172A"/>
        <text x="90" y="28" class="font-display text-white" font-size="14" font-weight="700" text-anchor="middle">btn-primary-action</text>
        <text x="90" y="65" class="font-sans text-slate-500" font-size="11" text-anchor="middle">Primary Dark (#0F172A)</text>
      </g>

      <!-- Button 2: Lime Accent -->
      <g transform="translate(205, 0)">
        <rect width="180" height="46" rx="12" fill="#84CC16"/>
        <text x="90" y="28" class="font-sans text-slate-900" font-size="14" font-weight="700" text-anchor="middle">Volt Lime Button</text>
        <text x="90" y="65" class="font-sans text-slate-500" font-size="11" text-anchor="middle">CTA Highlight (#84CC16)</text>
      </g>

      <!-- Button 3: Outline Clean -->
      <g transform="translate(410, 0)">
        <rect width="180" height="46" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
        <text x="90" y="28" class="font-sans text-slate-800" font-size="14" font-weight="600" text-anchor="middle">btn-outline</text>
        <text x="90" y="65" class="font-sans text-slate-500" font-size="11" text-anchor="middle">White + Border</text>
      </g>

      <!-- Button 4: Destructive Red -->
      <g transform="translate(615, 0)">
        <rect width="180" height="46" rx="12" fill="#FEE2E2" stroke="#FCA5A5"/>
        <text x="90" y="28" class="font-sans text-rose" font-size="14" font-weight="700" text-anchor="middle">Batal / Hapus</text>
        <text x="90" y="65" class="font-sans text-slate-500" font-size="11" text-anchor="middle">Rose-100 Soft</text>
      </g>

      <!-- Button 5: Disabled -->
      <g transform="translate(820, 0)">
        <rect width="180" height="46" rx="12" fill="#F1F5F9"/>
        <text x="90" y="28" class="font-sans text-slate-400" font-size="14" font-weight="600" text-anchor="middle">Disabled State</text>
        <text x="90" y="65" class="font-sans text-slate-500" font-size="11" text-anchor="middle">Slate-100 Inactive</text>
      </g>
    </g>
  </g>
  <line x1="80" y1="415" x2="1360" y2="415" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ==================== 3. FORM INPUTS & SEARCH (Y: 435 - 610) ==================== -->
  <g transform="translate(80, 435)">
    <text x="0" y="0" class="font-display text-slate-900" font-size="16">3. FORM INPUTS &amp; CONTROLS</text>

    <g transform="translate(0, 20)">
      <!-- Input Default -->
      <g transform="translate(0, 0)">
        <text x="0" y="14" class="font-sans text-slate-500" font-size="12" font-weight="600">INPUT STANDAR</text>
        <rect y="24" width="360" height="44" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
        <text x="16" y="51" class="font-sans text-slate-400" font-size="13">Masukkan nama lengkap member...</text>
      </g>

      <!-- Input Active Focus -->
      <g transform="translate(390, 0)">
        <text x="0" y="14" class="font-sans text-lime" font-size="12" font-weight="600">INPUT FOKUS (LIME RING)</text>
        <rect y="24" width="360" height="44" rx="10" fill="#FFFFFF" stroke="#84CC16" stroke-width="2"/>
        <text x="16" y="51" class="font-sans text-slate-900" font-size="13">Alexander Chen</text>
      </g>

      <!-- RFID Search Field -->
      <g transform="translate(780, 0)">
        <text x="0" y="14" class="font-sans text-slate-700" font-size="12" font-weight="600">RFID SCANNER INPUT</text>
        <rect y="24" width="360" height="44" rx="10" fill="#FFFFFF" stroke="#0F172A"/>
        <text x="16" y="51" class="font-sans text-slate-900" font-size="13">Scan RFID UID / Barcode...</text>
        <rect x="270" y="32" width="78" height="26" rx="6" fill="#ECFCCB"/>
        <text x="309" y="49" class="font-sans text-lime" font-size="10" font-weight="800" text-anchor="middle">READY</text>
      </g>
    </g>
  </g>
  <line x1="80" y1="565" x2="1360" y2="565" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ==================== 4. BADGES & PILLS (Y: 585 - 750) ==================== -->
  <g transform="translate(80, 585)">
    <text x="0" y="0" class="font-display text-slate-900" font-size="16">4. BADGES &amp; STATUS PILLS</text>

    <g transform="translate(0, 20)">
      <!-- Badge: Buka Hari Ini -->
      <g transform="translate(0, 0)">
        <rect width="130" height="32" rx="16" fill="#ECFCCB" stroke="#D9F99D"/>
        <circle cx="16" cy="16" r="3.5" fill="#65A30D"/>
        <text x="28" y="21" class="font-sans text-lime" font-size="11" font-weight="700">BUKA HARI INI</text>
      </g>

      <!-- Badge: Pro Gym -->
      <g transform="translate(145, 0)">
        <rect width="120" height="32" rx="8" fill="#ECFCCB"/>
        <text x="60" y="21" class="font-sans text-lime" font-size="12" font-weight="700" text-anchor="middle">PRO GYM</text>
      </g>

      <!-- Badge: Sepi & Segar -->
      <g transform="translate(280, 0)">
        <rect width="130" height="32" rx="8" fill="#D1FAE5" stroke="#A7F3D0"/>
        <circle cx="16" cy="16" r="4" fill="#059669"/>
        <text x="28" y="21" class="font-sans text-emerald" font-size="11" font-weight="700">Sepi &amp; Segar</text>
      </g>

      <!-- Badge: Jam Sibuk -->
      <g transform="translate(425, 0)">
        <rect width="130" height="32" rx="8" fill="#FEE2E2" stroke="#FCA5A5"/>
        <circle cx="16" cy="16" r="4" fill="#DC2626"/>
        <text x="28" y="21" class="font-sans text-rose" font-size="11" font-weight="700">Jam Sibuk</text>
      </g>

      <!-- Badge: Lunas POS -->
      <g transform="translate(570, 0)">
        <rect width="100" height="32" rx="8" fill="#0F172A"/>
        <text x="50" y="21" class="font-sans text-white" font-size="12" font-weight="700" text-anchor="middle">✔ LUNAS</text>
      </g>

      <!-- Badge: QRIS -->
      <g transform="translate(685, 0)">
        <rect width="110" height="32" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
        <text x="55" y="21" class="font-sans text-slate-800" font-size="12" font-weight="600" text-anchor="middle">📱 QRIS BCA</text>
      </g>
    </g>
  </g>
  <line x1="80" y1="710" x2="1360" y2="710" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ==================== 5. TOAST NOTIFICATIONS & HARDWARE ALERTS (Y: 730 - 950) ==================== -->
  <g transform="translate(80, 730)">
    <text x="0" y="0" class="font-display text-slate-900" font-size="16">5. NOTIFIKASI &amp; RFID STATUS TOAST</text>

    <g transform="translate(0, 20)">
      <!-- Toast Check-in Berhasil -->
      <g transform="translate(0, 0)" filter="url(#uikitShadow)">
        <rect width="400" height="74" rx="14" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1.5"/>
        <circle cx="36" cy="37" r="18" fill="#D1FAE5"/>
        <path d="M28 37L34 43L44 31" stroke="#059669" stroke-width="2.5" stroke-linecap="round"/>
        <text x="68" y="32" class="font-display text-slate-900" font-size="14">Check-in RFID Berhasil!</text>
        <text x="68" y="52" class="font-sans text-slate-500" font-size="12">Alexander Chen • Masa aktif s/d 12 Des 2026</text>
      </g>

      <!-- Toast Kartu Expired -->
      <g transform="translate(430, 0)" filter="url(#uikitShadow)">
        <rect width="400" height="74" rx="14" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.5"/>
        <circle cx="36" cy="37" r="18" fill="#FEE2E2"/>
        <text x="36" y="44" class="font-display text-rose" font-size="18" text-anchor="middle">!</text>
        <text x="68" y="32" class="font-display text-rose" font-size="14">Akses Ditolak: Kartu Expired</text>
        <text x="68" y="52" class="font-sans text-slate-500" font-size="12">Silakan perpanjang di kasir atau portal member</text>
      </g>

      <!-- Toast POS Sukses -->
      <g transform="translate(860, 0)" filter="url(#uikitShadow)">
        <rect width="420" height="74" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
        <circle cx="36" cy="37" r="18" fill="#ECFCCB"/>
        <path d="M28 37L34 43L44 31" stroke="#65A30D" stroke-width="2.5" stroke-linecap="round"/>
        <text x="68" y="32" class="font-display text-slate-900" font-size="14">Transaksi POS #POS-260907 Sukses</text>
        <text x="68" y="52" class="font-sans text-slate-500" font-size="12">Total: Rp 832.500 • Struk thermal tercetak</text>
      </g>
    </g>
  </g>
</svg>
